    <script>
      (function () {
        try {
          var stored = localStorage.getItem("anoop_theme");
          if (stored === "dark") {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
